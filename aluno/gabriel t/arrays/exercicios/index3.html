<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercício 3 - Histórico de pedidos</title>
</head>
<body>
  <h1>Exercício 3 - Histórico de pedidos</h1>

  <script>
    function adicionarPedido(pedidos, novoPedido) {
      if (pedidos.length < 10) {
        pedidos.push(novoPedido);
      } else {
        pedidos.shift();
        pedidos.push(novoPedido);
      }

      return pedidos;
    }

    const pedidos = ['0001', '0002', '0003', '0004', '0005', '0006', '0007', '0008', '0009', '0010'];
    const novoPedido = '0011';

    const historicoAtualizado = adicionarPedido(pedidos, novoPedido);
    console.log('Histórico atualizado:', historicoAtualizado);
  </script>
</body>
</html>
