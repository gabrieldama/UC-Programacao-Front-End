<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercício 4 - Lista de compras</title>
</head>
<body>
  <h1>Exercício 4 - Lista de compras</h1>

  <script>
    function gerarTextoCompras(itens) {
      return itens.join(', ');
    }

    const compras = ['Arroz', 'Feijão', 'Macarrão', 'Leite'];
    const textoCompras = gerarTextoCompras(compras);

    console.log('Lista de compras:', textoCompras);
  </script>
</body>
</html>
