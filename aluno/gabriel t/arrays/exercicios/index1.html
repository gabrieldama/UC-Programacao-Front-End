<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercício 1 - Fila de atendimento</title>
</head>
<body>
  <h1>Exercício 1 - Fila de atendimento</h1>

  <script>
    const fila = ['Ana', 'Bruno', 'Carlos'];

    fila.push('Davi');
    console.log('Fila após adicionar uma pessoa:');

    for (let i = 0; i < fila.length; i++) {
      console.log(fila[i]);
    }

    const pessoaAtendida = fila.shift();
    console.log('Pessoa removida do início:', pessoaAtendida);
    console.log('Fila após remoção:');

    for (let i = 0; i < fila.length; i++) {
      console.log(fila[i]);
    }
  </script>
</body>
</html>
