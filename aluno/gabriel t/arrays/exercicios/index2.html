<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercício 2 - Validação de números</title>
</head>
<body>
  <h1>Exercício 2 - Validação de números</h1>

  <script>
    function filtrarNumeros(arrayValores) {
      const numeros = [];

      for (const valor of arrayValores) {
        if (typeof valor === 'number') {
          numeros.push(valor);
        }
      }

      return numeros;
    }

    const valores = [10, 'texto', 25, true, 40, null, 7];
    const numerosValidos = filtrarNumeros(valores);

    console.log('Valores filtrados:', numerosValidos);
  </script>
</body>
</html>
