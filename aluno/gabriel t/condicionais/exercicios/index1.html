<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 1</title>
</head>
<body>
  <h1>Exercício 1</h1>
  <script>
    const minimo = Number(prompt('Digite o número mínimo:'));
    const maximo = Number(prompt('Digite o número máximo:'));
    const numero = Number(prompt('Digite um número:'));

    if (isNaN(minimo) || isNaN(maximo) || isNaN(numero)) {
      alert('Digite apenas números válidos.');
    } else if (minimo >= maximo) {
      alert('O número mínimo deve ser menor que o máximo.');
    } else if (numero > minimo && numero < maximo) {
      alert('O número está entre o mínimo e o máximo.');
    } else {
      alert('O número está fora do intervalo.');
    }
  </script>
</body>
</html>
