<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 5</title>
</head>
<body>
  <h1>Exercício 5</h1>
  <script>
    const nota = Number(prompt('Digite a nota:'));

    if (isNaN(nota)) {
      alert('Digite uma nota válida.');
    } else if (nota >= 7 && nota <= 10) {
      alert('A nota está entre 7.0 e 10.0.');
    } else {
      alert('A nota não está entre 7.0 e 10.0.');
    }
  </script>
</body>
</html>
